<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cross Chrono</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tabs">
    <button data-tab="runners">Coureurs</button>
    <button data-tab="race">Course</button>
    <button data-tab="results">Résultats</button>
  </nav>

  <main>
    <section id="tab-runners" class="panel" hidden>
      <label for="runners-input">Un coureur par ligne : nom ; course</label>
      <textarea id="runners-input" rows="12" placeholder="Léa Martin ; 6e filles&#10;Hugo Bernard ; 6e garçons"></textarea>
      <div class="actions">
        <button id="save-runners" class="primary">Enregistrer</button>
        <button id="print-bibs">Imprimer les dossards</button>
      </div>
      <p id="runners-status" class="muted"></p>
    </section>

    <section id="tab-race" class="panel" hidden>
      <ul id="starts" class="starts"></ul>
      <video id="video" playsinline muted hidden></video>
      <button id="toggle-scan" class="primary big">Scanner</button>
      <form id="manual-form" class="actions">
        <input id="manual-bib" type="number" inputmode="numeric" min="1" autocomplete="off" aria-label="Numéro de dossard" placeholder="N° de dossard">
        <button type="submit">Valider</button>
      </form>
      <p id="flash" class="flash" aria-live="assertive"></p>
    </section>

    <section id="tab-results" class="panel" hidden>
      <div id="results"></div>
      <div class="actions">
        <button id="export-csv" class="primary">Exporter</button>
        <button id="reset-all" class="ghost danger" data-confirm>Tout effacer</button>
      </div>
    </section>
  </main>

  <div id="bib-sheet" class="bib-sheet"></div>
  <canvas id="frame" hidden></canvas>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
